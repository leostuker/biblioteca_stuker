{% extends "base.html" %}

{% block title %}Entrar &bull; Biblioteca Stüker{% endblock %}

{% block content %}
<div class="auth-wrapper">
	<h1 class="auth-header">biblioteca stüker.</h1>
	<div class="post-card">
		{% if erro %}
			<div class="alert alert-error">{{ erro }}</div>
		{% endif %}

		<form action="/login" method="post">
			<div class="form-group">
				<label for="usuario" class="form-label">Usuário ou E-mail</label>
				<input type="text" id="usuario" name="usuario" required autofocus placeholder="leo ou seu@email.com" class="form-control">
			</div>

			<div class="form-group">
				<label for="senha" class="form-label">Senha</label>
				<input type="password" id="senha" name="senha" required placeholder="••••••••" class="form-control">
			</div>

			<button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px;">Entrar</button>
		</form>

		<div class="post-footer" style="justify-content: center;">
			<span class="tag">Não possui conta? <a href="/registro">Criar cadastro de leitor</a></span>
		</div>
	</div>
</div>
{% endblock %}
