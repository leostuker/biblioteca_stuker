{% extends "base.html" %}

{% block title %}Criar Conta &bull; Biblioteca Stüker{% endblock %}

{% block content %}
<div class="auth-wrapper">
	<h1 class="auth-header">novo leitor.</h1>
	<div class="post-card">
		{% if erro %}
			<div class="alert alert-error">{{ erro }}</div>
		{% endif %}

		<form action="/registro" method="post">
			<div class="form-group">
				<label for="nome" class="form-label">Nome Completo</label>
				<input type="text" id="nome" name="nome" required autofocus placeholder="Leonardo Stüker" class="form-control">
			</div>

			<div class="form-group">
				<label for="usuario" class="form-label">Nome de Usuário (login)</label>
				<input type="text" id="usuario" name="usuario" required placeholder="ex: stuker" class="form-control">
			</div>

			<div class="form-group">
				<label for="email" class="form-label">E-mail (opcional)</label>
				<input type="email" id="email" name="email" placeholder="voce@exemplo.com" class="form-control">
			</div>

			<div class="form-group">
				<label for="senha" class="form-label">Senha</label>
				<input type="password" id="senha" name="senha" required minlength="4" placeholder="••••••••" class="form-control">
			</div>

			<button type="submit" class="btn btn-success" style="width: 100%; padding: 10px; font-size: 14px;">Cadastrar</button>
		</form>

		<div class="post-footer" style="justify-content: center;">
			<span class="tag">Já possui cadastro? <a href="/login">Fazer login</a></span>
		</div>
	</div>
</div>
{% endblock %}
