services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_biblioteca
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-leo}
      POSTGRES_PASSWORD: ${DB_PASS:-1998}
      POSTGRES_DB: ${DB_NAME:-biblioteca_stuker}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leo} -d ${DB_NAME:-biblioteca_stuker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rede_biblioteca

  api:
    build: .
    container_name: api_biblioteca
    restart: always
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-leo}
      - DB_PASS=${DB_PASS:-1998}
      - DB_NAME=${DB_NAME:-biblioteca_stuker}
      - DATABASE_URL=postgresql://${DB_USER:-leo}:${DB_PASS:-1998}@postgres:5432/${DB_NAME:-biblioteca_stuker}
      - SECRET_KEY=${SECRET_KEY:-chave_secreta_biblioteca_stuker_1998}
      - ADMIN_USER=${ADMIN_USER:-leo}
      - ADMIN_PASS=${ADMIN_PASS:-1998}
      - ADMIN_NOME=${ADMIN_NOME:-Leonardo Stüker}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-leo@stuker.dev}
    volumes:
      - ./dados:/app/dados:ro
      - ./frontend:/app/frontend:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - rede_biblioteca

networks:
  rede_biblioteca:
    driver: bridge

volumes:
  dados_postgres:
